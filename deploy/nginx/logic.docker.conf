worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $uri $access_loggable {
        default 1;
        /health 0;
    }
    access_log /dev/stdout combined if=$access_loggable;

    upstream logic_servers {
        zone logic_servers 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server logic-1:8080 resolve;
        server logic-2:8080 resolve;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://logic_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

stream {
    upstream logic_tcp_servers {
        zone logic_tcp_servers 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server logic-1:8081 resolve;
        server logic-2:8081 resolve;
    }

    server {
        listen 8081;
        proxy_connect_timeout 3s;
        proxy_timeout 3600s;
        proxy_pass logic_tcp_servers;
    }
}
