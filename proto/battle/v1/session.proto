syntax = "proto3";

package battle.v1;

option go_package = "server/internal/contract/battlepb;battlepb";

message ClientHello {
  string room_name = 1;
  int64 player_id = 2;
  string token = 3;
}

message ServerHello {
  uint32  conv = 1;
  string message = 2;
}

message GameStart {
  string room_name = 1;
  repeated int64 player_ids = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

message ClientPacket {
  oneof payload {
    ClientHello hello = 1;
    ClientInput input = 2;
    ChooseBlessing choose_blessing = 3;
    ClientHeartbeat heartbeat = 4;
    SelectRoomExit select_room_exit = 5;
  }
}

message ServerPacket {
  oneof payload {
    ServerHello hello = 1;
    GameStart game_start = 2;
    Error error = 3;
    GameOver game_over = 4;
    WorldSnapshot snapshot = 5;
  }
}

message GameOver {
  string room_name = 1;
  repeated int64 player_ids = 2;
  string reason = 3;
  repeated PlayerBattleStats player_stats = 4;
}

message PlayerBattleStats {
  int64 player_id = 1;
  int32 total_kills = 2;
  repeated MonsterKillCount kills = 3;
}

message MonsterKillCount {
  string monster_kind = 1;
  int32 count = 2;
}

message ClientInput {
  string room_name = 1;
  int64 player_id = 2;
  Direction movement = 3;
  reserved 4;
  bool attack_requested = 5;
  bool dash_requested = 6;
}

message Position {
  float x = 1;
  float y = 2;
}

message Direction {
  float x = 1;
  float y = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_PROJECTILE = 3;
  ENTITY_KIND_OBSTACLE = 4;
  ENTITY_KIND_TRAP = 5;
}

message EntitySnapshot{
  uint64 entity = 1;
  Position position = 2;
  Direction direction = 3;
  reserved 4, 5;
  int32 current_health = 6;
  int32 max_health = 7;
  EntityKind kind = 8;
  int64 player_id = 9;
  string monster_kind = 10;
  string hero = 11;
  float collision_radius = 12;
  string scene_object_kind = 13;
}

enum RoomFlowState {
  ROOM_FLOW_STATE_UNSPECIFIED = 0;
  ROOM_FLOW_STATE_ENTERING_ROOM = 1;
  ROOM_FLOW_STATE_FIGHTING = 2;
  ROOM_FLOW_STATE_ROOM_CLEARED = 3;
  ROOM_FLOW_STATE_CHOOSING_BLESSING = 4;
  ROOM_FLOW_STATE_CHOOSING_EXIT = 5;
  ROOM_FLOW_STATE_TRANSITIONING = 6;
}

enum BlessingId {
  BLESSING_ID_UNSPECIFIED = 0;
  BLESSING_ID_BURN_ON_HIT = 1;
  BLESSING_ID_LIFE_STEAL = 2;
  BLESSING_ID_FREEZE_ON_HIT = 3;
  BLESSING_ID_CRITICAL_STRIKE = 4;
  BLESSING_ID_CHAIN_LIGHTNING = 5;
}

message PlayerProgressSnapshot {
  int64 player_id = 1;
  int32 level = 2;
  int32 experience = 3;
  int32 experience_to_next_level = 4;
  int32 pending_upgrade_choices = 5;
}

message BlessingOptionSnapshot {
  int32 option_id = 1;
  BlessingId blessing_id = 2;
}

message PlayerBlessingSnapshot {
  BlessingId blessing_id = 1;
  int32 level = 2;
}

message PlayerBlessingStateSnapshot {
  int64 player_id = 1;
  repeated PlayerBlessingSnapshot blessings = 2;
  repeated BlessingOptionSnapshot current_options = 3;
}

enum AttackKind {
  ATTACK_KIND_UNSPECIFIED = 0;
  ATTACK_KIND_MELEE = 1;
  ATTACK_KIND_PROJECTILE = 2;
}

message AttackEvent {
  uint64 attacker_entity = 1;
  uint64 action_id = 2;
  AttackKind attack_kind = 3;
  Direction direction = 4;
  reserved 5;
  uint64 start_tick = 6;
  uint64 active_start_tick = 7;
  uint64 active_end_tick = 8;
  uint64 recovery_end_tick = 9;
}

message DeathEvent {
  uint64 victim_entity = 1;
  EntityKind victim_kind = 2;
  string monster_kind = 3;
  Position position = 4;
  Direction direction = 5;
  reserved 6, 7;
  uint64 killer_entity = 8;
}

message BattleEvent {
  uint64 event_id = 1;
  oneof payload {
    AttackEvent attack = 2;
    DeathEvent death = 3;
    RoomClearedEvent room_cleared = 4;
    RoomEnteredEvent room_entered = 5;
  }
}

message PlayerRoomExitChoiceSnapshot {
  int64 player_id = 1;
  uint32 room_exit_id = 2;
}

message WorldSnapshot {
  string room_name = 1;
  repeated EntitySnapshot entities = 2;
  reserved 3, 4;
  float reward_selection_remaining_seconds = 5;
  repeated PlayerProgressSnapshot player_progress = 6;
  repeated PlayerBlessingStateSnapshot player_blessings = 7;
  uint64 server_tick = 8;
  repeated BattleEvent events = 9;
  uint32 tick_rate = 10;
  uint32 current_room_id = 11;
  RoomFlowState room_state = 12;
  repeated uint32 available_room_exit_ids = 13;
  repeated PlayerRoomExitChoiceSnapshot player_room_exit_choices = 14;
  string current_room_layout_id = 15;
}

message ChooseBlessing {
  string room_name = 1;
  int64 player_id = 2;
  int32 option_id = 3;
}


message ClientHeartbeat {
  string room_name = 1;
  int64 player_id = 2;
}

message SelectRoomExit {
  string room_name = 1;
  int64 player_id = 2;
  uint32 next_room_id = 3;
}

message RoomClearedEvent {
  uint32 room_id = 1;
}

message RoomEnteredEvent {
  uint32 room_id = 1;
  string layout_id = 2;
}
