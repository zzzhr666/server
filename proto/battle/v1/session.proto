syntax = "proto3";

package battle.v1;

option go_package = "server/internal/contract/battlepb;battlepb";

message ClientHello {
  string room_name = 1;
  int64 player_id = 2;
  string token = 3;
}

message ServerHello {
  uint32  conv = 1;
  string message = 2;
}

message GameStart {
  string room_name = 1;
  repeated int64 player_ids = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

message ClientPacket {
  reserved 6;
  oneof payload {
    ClientHello hello = 1;
    ClientInput input = 2;
    ChooseBlessing choose_blessing = 3;
    ClientHeartbeat heartbeat = 4;
    SelectRoomExit select_room_exit = 5;
    ChooseFreeReward choose_free_reward = 7;
    PurchaseShopItem purchase_shop_item = 8;
  }
}

message ServerPacket {
  oneof payload {
    ServerHello hello = 1;
    GameStart game_start = 2;
    Error error = 3;
    GameOver game_over = 4;
    WorldSnapshot snapshot = 5;
    RoomSnapshot room_snapshot = 6;
    StateUpdate state_update = 7;
  }
}

message RoomSnapshot {
  string room_name = 1;
  uint32 current_room_id = 2;
  RoomFlowState room_state = 3;
  string current_room_layout_id = 4;
  WorldBounds world_bounds = 5;
  repeated uint32 available_room_exit_ids = 6;
  repeated EntitySnapshot static_entities = 7;
}

message StateUpdate {
  string room_name = 1;
  uint64 server_tick = 2;
  float reward_selection_remaining_seconds = 3;
  repeated PlayerProgressSnapshot player_progress = 4;
  repeated PlayerBlessingStateSnapshot player_blessings = 5;
  repeated BattleEvent events = 6;
  repeated PlayerRoomExitChoiceSnapshot player_room_exit_choices = 7;
  repeated PlayerFreeRewardState free_reward_states = 8;
  repeated ShopOffer shop_offers = 9;
  repeated PlayerSoulSnapshot player_souls = 10;
  repeated ShopItemDefinition shop_item_definitions = 11;
  repeated PlayerPurchasedShopItemsSnapshot purchased_shop_items = 12;
  repeated PlayerCombatStatsSnapshot player_combat_stats = 13;
}

message GameOver {
  string room_name = 1;
  repeated int64 player_ids = 2;
  string reason = 3;
  repeated PlayerBattleStats player_stats = 4;
}

message PlayerBattleStats {
  int64 player_id = 1;
  int32 total_kills = 2;
  repeated MonsterKillCount kills = 3;
  string nickname = 4;
}

message MonsterKillCount {
  string monster_kind = 1;
  int32 count = 2;
}

message ClientInput {
  string room_name = 1;
  int64 player_id = 2;
  Direction movement = 3;
  reserved 4;
  bool attack_requested = 5;
  bool dash_requested = 6;
}

message Position {
  float x = 1;
  float y = 2;
}

message WorldBounds {
  float min_x = 1;
  float max_x = 2;
  float min_y = 3;
  float max_y = 4;
}

message Direction {
  float x = 1;
  float y = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_PROJECTILE = 3;
  ENTITY_KIND_OBSTACLE = 4;
  ENTITY_KIND_TRAP = 5;
}

message EntitySnapshot{
  uint64 entity = 1;
  Position position = 2;
  Direction direction = 3;
  reserved 4, 5;
  int32 current_health = 6;
  int32 max_health = 7;
  EntityKind kind = 8;
  int64 player_id = 9;
  string monster_kind = 10;
  string hero = 11;
  float collision_radius = 12;
  string scene_object_kind = 13;
  string boss_phase = 14;
  string boss_ability = 15;
  string boss_action_phase = 16;
  float boss_ability_remaining_seconds = 17;
  uint32 boss_sequence_index = 18;
  string nickname = 19;
}

enum RoomFlowState {
  ROOM_FLOW_STATE_UNSPECIFIED = 0;
  ROOM_FLOW_STATE_ENTERING_ROOM = 1;
  ROOM_FLOW_STATE_FIGHTING = 2;
  ROOM_FLOW_STATE_ROOM_CLEARED = 3;
  ROOM_FLOW_STATE_CHOOSING_BLESSING = 4;
  ROOM_FLOW_STATE_CHOOSING_EXIT = 5;
  ROOM_FLOW_STATE_TRANSITIONING = 6;
  ROOM_FLOW_STATE_REWARDING = 7;
}

enum BlessingId {
  BLESSING_ID_UNSPECIFIED = 0;
  BLESSING_ID_BURN_ON_HIT = 1;
  BLESSING_ID_LIFE_STEAL = 2;
  BLESSING_ID_FREEZE_ON_HIT = 3;
  BLESSING_ID_CRITICAL_STRIKE = 4;
  BLESSING_ID_CHAIN_LIGHTNING = 5;
  BLESSING_ID_FRENZY = 6;
  BLESSING_ID_SWIFT = 7;
  BLESSING_ID_TOUGHNESS = 8;
  BLESSING_ID_HEAVY_STRIKE = 9;
  BLESSING_ID_ARMOR_BREAK = 10;
  BLESSING_ID_REVENGE = 11;
  BLESSING_ID_SOUL_HARVEST = 12;
}

message PlayerProgressSnapshot {
  int64 player_id = 1;
  int32 level = 2;
  int32 experience = 3;
  int32 experience_to_next_level = 4;
  int32 pending_upgrade_choices = 5;
}

message BlessingOptionSnapshot {
  int32 option_id = 1;
  BlessingId blessing_id = 2;
}

message PlayerBlessingSnapshot {
  BlessingId blessing_id = 1;
  int32 level = 2;
}

message PlayerBlessingStateSnapshot {
  int64 player_id = 1;
  repeated PlayerBlessingSnapshot blessings = 2;
  repeated BlessingOptionSnapshot current_options = 3;
}

enum AttackKind {
  ATTACK_KIND_UNSPECIFIED = 0;
  ATTACK_KIND_MELEE = 1;
  ATTACK_KIND_PROJECTILE = 2;
}

message AttackEvent {
  uint64 attacker_entity = 1;
  uint64 action_id = 2;
  AttackKind attack_kind = 3;
  Direction direction = 4;
  reserved 5;
  uint64 start_tick = 6;
  uint64 active_start_tick = 7;
  uint64 active_end_tick = 8;
  uint64 recovery_end_tick = 9;
}

message DeathEvent {
  uint64 victim_entity = 1;
  EntityKind victim_kind = 2;
  string monster_kind = 3;
  Position position = 4;
  Direction direction = 5;
  reserved 6, 7;
  uint64 killer_entity = 8;
}

message BattleEvent {
  uint64 event_id = 1;
  oneof payload {
    AttackEvent attack = 2;
    DeathEvent death = 3;
    RoomClearedEvent room_cleared = 4;
    RoomEnteredEvent room_entered = 5;
  }
}

message PlayerRoomExitChoiceSnapshot {
  int64 player_id = 1;
  uint32 room_exit_id = 2;
}

message WorldSnapshot {
  string room_name = 1;
  repeated EntitySnapshot entities = 2;
  reserved 3, 4;
  float reward_selection_remaining_seconds = 5;
  repeated PlayerProgressSnapshot player_progress = 6;
  repeated PlayerBlessingStateSnapshot player_blessings = 7;
  uint64 server_tick = 8;
  repeated BattleEvent events = 9;
  uint32 tick_rate = 10;
  uint32 current_room_id = 11;
  RoomFlowState room_state = 12;
  repeated uint32 available_room_exit_ids = 13;
  repeated PlayerRoomExitChoiceSnapshot player_room_exit_choices = 14;
  string current_room_layout_id = 15;
  repeated PlayerFreeRewardState free_reward_states = 16;
  repeated ShopOffer shop_offers = 17;
  repeated PlayerSoulSnapshot player_souls = 18;
  repeated ShopItemDefinition shop_item_definitions = 19;
  repeated PlayerPurchasedShopItemsSnapshot purchased_shop_items = 20;
  repeated PlayerCombatStatsSnapshot player_combat_stats = 21;
  WorldBounds world_bounds = 22;
}

message ChooseBlessing {
  string room_name = 1;
  int64 player_id = 2;
  int32 option_id = 3;
}


message ClientHeartbeat {
  string room_name = 1;
  int64 player_id = 2;
}

message SelectRoomExit {
  string room_name = 1;
  int64 player_id = 2;
  uint32 next_room_id = 3;
}

message RoomClearedEvent {
  uint32 room_id = 1;
}

message RoomEnteredEvent {
  uint32 room_id = 1;
  string layout_id = 2;
}

message PlayerFreeRewardState {
  int64 player_id = 1;
  bool completed = 2;
  FreeRewardKind selected_kind = 3;
}

enum FreeRewardKind {
  FREE_REWARD_KIND_UNSPECIFIED = 0;
  FREE_REWARD_KIND_HEAL = 1;
  FREE_REWARD_KIND_ATTACK = 2;
  FREE_REWARD_KIND_DAMAGE_REDUCTION = 3;
  FREE_REWARD_KIND_BLESSING = 4;
  FREE_REWARD_KIND_SKIP = 5;
}

message ChooseFreeReward {
  string room_name = 1;
  int64 player_id = 2;
  FreeRewardKind kind = 3;
}

message PurchaseShopItem {
  string room_name = 1;
  int64 player_id = 2;
  uint32 item_id = 3;
}

message ShopOffer {
  uint32 item_id = 1;
  int32 price = 2;
}

message PlayerSoulSnapshot {
  int64 player_id = 1;
  int32 souls = 2;
}

message PlayerCombatStatsSnapshot {
  int64 player_id = 1;
  int32 attack_damage = 2;
  float move_speed = 3;
  float attack_cooldown_seconds = 4;
  int32 armor = 5;
}

enum ShopBuffKind {
  SHOP_BUFF_KIND_UNSPECIFIED = 0;
  SHOP_BUFF_KIND_ATTACK_DAMAGE = 1;
  SHOP_BUFF_KIND_MAX_HEALTH = 2;
  SHOP_BUFF_KIND_ARMOR = 3;
  SHOP_BUFF_KIND_MOVE_SPEED = 4;
}

message ShopBuff {
  ShopBuffKind kind = 1;
  float value = 2;
}

message ShopItemDefinition {
  uint32 item_id = 1;
  string item_name = 2;
  repeated ShopBuff buffs = 3;
}

message PlayerPurchasedShopItemsSnapshot {
  int64 player_id = 1;
  repeated uint32 item_ids = 2;
}
