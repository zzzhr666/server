syntax = "proto3";

package realtime.v1;

import "google/protobuf/timestamp.proto";

option go_package = "server/internal/contract/realtimepb;realtimepb";

// ClientEnvelope 表示客户端在 TCP 连接上发送的一次请求。
// 首帧 payload 必须是 AuthenticateRequest。
message ClientEnvelope {
  // request_id 必须非零，用于关联此请求及其服务端响应。
  uint64 request_id = 1;
  oneof payload {
    AuthenticateRequest authenticate = 10;
    HeartbeatRequest heartbeat = 11;
    MatchStartRequest match_start = 12;
    MatchCancelRequest match_cancel = 13;
    MatchResumeRequest match_resume = 14;
    PlayerGetRequest player_get = 20;
    GrowthGetRequest growth_get = 21;
    UpgradeGrowthRequest growth_upgrade = 22;
    SendFriendRequestRequest friend_request_send = 23;
    ListIncomingFriendRequestsRequest friend_request_list_incoming = 24;
    ListOutgoingFriendRequestsRequest friend_request_list_outgoing = 25;
    AcceptFriendRequestRequest friend_request_accept = 26;
    RejectFriendRequestRequest friend_request_reject = 27;
    FriendListRequest friend_list = 28;
    DeleteFriendRequest friend_delete = 29;
    LogoutRequest logout = 30;
    SendWorldChatRequest chat_world_send = 31;
    SendDirectChatRequest chat_direct_send = 32;
    ListWorldChatRequest chat_world_list = 33;
    ListDirectChatRequest chat_direct_list = 34;
    PlayerAvatarUpdateRequest player_avatar_update = 35;
    ListLeaderboardRequest leaderboard_list = 36;
  }
}

// ServerEnvelope 表示服务端响应或主动推送的事件。
message ServerEnvelope {
  // request_id 对应客户端请求；服务端主动推送使用零。
  uint64 request_id = 1;
  oneof payload {
    Authenticated authenticated = 10;
    HeartbeatAck heartbeat_ack = 11;
    MatchResult match_result = 12;
    MatchCanceled match_canceled = 13;
    ProtocolError error = 14;
    ConnectionReplaced connection_replaced = 15;
    FriendPresenceChanged friend_presence_changed = 16;
    FriendRemoved friend_removed = 17;
    FriendRequestReceived friend_request_received = 18;
    FriendRequestHandled friend_request_handled = 19;
    PlayerResponse player = 20;
    GrowthResponse growth = 21;
    UpgradeGrowthResponse growth_upgrade_result = 22;
    FriendRequestSentResponse friend_request_sent = 23;
    FriendRequestResponse friend_requests = 24;
    FriendRequestHandledResponse friend_request_handled_ack = 25;
    FriendListResponse friends = 26;
    FriendDeletedResponse friend_deleted = 27;
    LogoutResponse logout_ack = 28;
    ChatSendResponse chat_sent = 29;
    ChatMessagesResponse chat_messages = 30;
    ChatMessagePushed chat_message_pushed = 31;
    LeaderboardResponse leaderboard = 32;
  }
}

message Authenticated {
  int64 player_id = 1;
}

message HeartbeatRequest{}

message HeartbeatAck{}

message MatchCancelRequest{}

message MatchResumeRequest{}

message MatchStartRequest{
  string weapon = 1;
  bool solo = 2;
}

message MatchCanceled {}

message MatchResult {
  string status = 1;
  string room_name = 2;
  string token = 3;
  string battle_node_name = 4;
  string battle_udp_addr = 5;
}

// AuthenticateRequest 必须是新连接发送的第一个 payload。
message AuthenticateRequest {
  string token = 1;
}

enum ErrorCode {
  UNSPECIFIED = 0;
  UNAUTHENTICATED = 1;
  INVALID_ARGUMENT = 2;
  NOT_FOUND = 3;
  CONFLICT = 4;
  INTERNAL = 5;
}

message ProtocolError {
  ErrorCode code = 1;
  string message = 2;
}

message ConnectionReplaced {}

message FriendPresenceChanged {
  int64 player_id = 1;
  bool online = 2;
  string status = 3;
}

message FriendRemoved {
  int64 player_id = 1;
}

message FriendRequestReceived {
  int64 player_id = 1;
  string nickname = 2;
}

message FriendRequestHandled {
  int64 player_id = 1;
}

message Player {
  int64 id = 1;
  string nickname = 2;
  string avatar = 3;
  string email = 4;
  string phone = 5;
  int64 coins = 6;
}

message FriendRequest {
  int64 from_player_id = 1;
  int64 to_player_id = 2;
  google.protobuf.Timestamp created_at = 3;
  string from_nickname = 4;
  string to_nickname = 5;
}

message FriendSummary {
  int64 player_id = 1;
  string nickname = 2;
  string avatar = 3;
  bool online = 4;
  string status = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Growth {
  int64 player_id = 1;
  int32 attack_level = 2;
  int32 attack_speed_level = 3;
  int32 health_level = 4;
  int32 move_speed_level = 5;
  repeated GrowthUpgradeOption upgrade_options = 6;
}

message GrowthUpgradeOption {
  string type = 1;
  int32 current_level = 2;
  int64 next_cost = 3;
  int32 max_level = 4;
}

message PlayerResponse {
  Player player = 1;
}

message PlayerAvatarUpdateRequest {
  string avatar = 1;
}

message GrowthResponse {
  Growth growth = 1;
}

message UpgradeGrowthResponse {
  Growth growth = 1;
  int64 remaining_coins = 2;
  int64 cost = 3;
}

message UpgradeGrowthRequest {
  string type = 1;
}

message DeleteFriendRequest {
  int64 friend_player_id = 1;
}

message SendFriendRequestRequest {
  int64 to_player_id = 1;
}

message FriendRequestSentResponse {
  int64 to_player_id = 1;
  string to_nickname = 2;
}

message ListIncomingFriendRequestsRequest {}

message ListOutgoingFriendRequestsRequest {}

message FriendRequestResponse {
  repeated FriendRequest requests = 1;
}

message AcceptFriendRequestRequest {
  int64 from_player_id = 1;
}

message RejectFriendRequestRequest {
  int64 from_player_id = 1;
}

message FriendRequestHandledResponse {}

message FriendListRequest {}

message FriendListResponse {
  repeated FriendSummary friends = 1;
}

message FriendDeletedResponse {}

message LogoutRequest {}

message LogoutResponse {}

message PlayerGetRequest {}

message GrowthGetRequest {}

message ChatMessage {
  string message_key = 1;
  string channel_type = 2;
  string channel_key = 3;
  int64 sender_id = 4;
  int64 receiver_id = 5;
  string content = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  string client_message_key = 9;
  string sender_nickname = 10;
}

message SendWorldChatRequest {
  string content = 1;
  string client_message_key = 2;
}

message SendDirectChatRequest {
  int64 receiver_id = 1;
  string content = 2;
  string client_message_key = 3;
}

message ListWorldChatRequest {
  int64 limit = 1;
  string before_message_key = 2;
}

message ListDirectChatRequest {
  int64 friend_id = 1;
  int64 limit = 2;
  string before_message_key = 3;
}

message ChatSendResponse {
  ChatMessage message = 1;
}

message ChatMessagesResponse {
  repeated ChatMessage messages = 1;
}

message ChatMessagePushed {
  ChatMessage message = 1;
}

enum LeaderboardType {
  LEADERBOARD_TYPE_UNSPECIFIED = 0;
  LEADERBOARD_TYPE_SOLO_CLEAR_TIME = 1;
  LEADERBOARD_TYPE_DUO_CLEAR_TIME = 2;
  LEADERBOARD_TYPE_TOTAL_KILLS = 3;
}

message ListLeaderboardRequest {
  LeaderboardType type = 1;
  string map_version = 2;
  int64 limit = 3;
}

message LeaderboardPlayer {
  int64 player_id = 1;
  string nickname = 2;
  string avatar = 3;
}

message LeaderboardEntry {
  int64 rank = 1;
  repeated LeaderboardPlayer players = 2;
  int64 score = 3;
}

message LeaderboardResponse {
  LeaderboardType type = 1;
  string map_version = 2;
  repeated LeaderboardEntry entries = 3;
}
