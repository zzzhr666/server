name: game-demo

services:
  logs-init:
    image: alpine:3.22
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p
        /workspace/logs/state
        /workspace/logs/rcenter
        /workspace/logs/logic-1
        /workspace/logs/logic-2
        /workspace/logs/battle-1
        /workspace/logs/battle-2
        && find /workspace/logs -type d -exec chmod 0777 {} +
        && find /workspace/logs -type f -exec chmod 0666 {} +
    volumes:
      - .:/workspace

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - game-redis-data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    healthcheck:
      test: [ "CMD","redis-cli","ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  state:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.state
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "game"
      STATE_GRPC_ADDR: ":9001"
    volumes:
      - ./logs/state:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:9200/metrics" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      logs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  rcenter:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.rcenter
    restart: unless-stopped
    environment:
      STATE_GRPC_ADDR: "state:9001"
      RCENTER_GRPC_ADDR: ":9002"
    volumes:
      - ./logs/rcenter:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:9200/metrics" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      logs-init:
        condition: service_completed_successfully
      state:
        condition: service_healthy

  logic-1:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.logic
    restart: unless-stopped
    command:
      - "--name"
      - "logic-1"
    environment:
      STATE_GRPC_ADDR: "state:9001"
      RCENTER_GRPC_ADDR: "rcenter:9002"
    volumes:
      - ./logs/logic-1:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      logs-init:
        condition: service_completed_successfully
      state:
        condition: service_healthy
      rcenter:
        condition: service_healthy
  logic-2:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.logic
    restart: unless-stopped
    command:
      - "--name"
      - "logic-2"
    environment:
      STATE_GRPC_ADDR: "state:9001"
      RCENTER_GRPC_ADDR: "rcenter:9002"
    volumes:
      - ./logs/logic-2:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      logs-init:
        condition: service_completed_successfully
      state:
        condition: service_healthy
      rcenter:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      logic-1:
        condition: service_healthy
      logic-2:
        condition: service_healthy

  battle-1:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.battle
    restart: unless-stopped
    command:
      - "--node-name"
      - "battle-1"
      - "--control-addr"
      - "battle-1:9101"
      - "--udp-bind-addr"
      - "0.0.0.0:7001"
      - "--udp-addr"
      - "${SERVER_LAN_IP:?set SERVER_LAN_IP in .env}:7001"
      - "--rcenter-addr"
      - "rcenter:9002"
      - "--max-players"
      - "100"
    environment:
      LOG_LEVEL: "info"
      LOG_MODE: "release"
      METRICS_ADDR: "0.0.0.0:9200"
    volumes:
      - ./logs/battle-1:/app/logs
    ports:
      - "7001:7001/udp"
    depends_on:
      logs-init:
        condition: service_completed_successfully
      rcenter:
        condition: service_healthy

  battle-2:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.battle
    restart: unless-stopped
    command:
      - "--node-name"
      - "battle-2"
      - "--control-addr"
      - "battle-2:9102"
      - "--udp-bind-addr"
      - "0.0.0.0:7002"
      - "--udp-addr"
      - "${SERVER_LAN_IP:?set SERVER_LAN_IP in .env}:7002"
      - "--rcenter-addr"
      - "rcenter:9002"
      - "--max-players"
      - "100"
    environment:
      LOG_LEVEL: "info"
      LOG_MODE: "release"
      METRICS_ADDR: "0.0.0.0:9200"
    volumes:
      - ./logs/battle-2:/app/logs
    ports:
      - "7002:7002/udp"
    depends_on:
      logs-init:
        condition: service_completed_successfully
      rcenter:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command:
      - "mongod"
      - "--bind_ip_all"
    volumes:
      - game-mongo-data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      logic-1:
        condition: service_healthy
      logic-2:
        condition: service_healthy
      state:
        condition: service_healthy
      rcenter:
        condition: service_healthy
      battle-1:
        condition: service_started
      battle-2:
        condition: service_started
volumes:
  game-redis-data:
    name: "game-redis-data"
  game-mongo-data:
    name: "game-mongo-data"
