name: game-demo

services:
  redis:
    image: redis:7.4-alpine
    volumes:
      - game-redis-data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
    healthcheck:
      test: [ "CMD","redis-cli","ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  state:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.state
    environment:
      REDIS_ADDR: "redis:6379"
      STATE_GRPC_ADDR: ":9001"
    depends_on:
      redis:
        condition: service_healthy

  rcenter:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.rcenter
    environment:
      STATE_GRPC_ADDR: "state:9001"
      RCENTER_GRPC_ADDR: ":9002"
    depends_on:
      state:
        condition: service_started

  logic-1:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.logic
    command:
      - "--name"
      - "logic-1"
    environment:
      STATE_GRPC_ADDR: "state:9001"
      RCENTER_GRPC_ADDR: "rcenter:9002"
    depends_on:
      state:
        condition: service_started
      rcenter:
        condition: service_started
  logic-2:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.logic
    command:
      - "--name"
      - "logic-2"
    environment:
      STATE_GRPC_ADDR: "state:9001"
      RCENTER_GRPC_ADDR: "rcenter:9002"
    depends_on:
      state:
        condition: service_started
      rcenter:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.nginx
    ports:
      - "8080:8080"
    depends_on:
      logic-1:
        condition: service_started
      logic-2:
        condition: service_started

  battle-1:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.battle
    command:
      - "--node-name"
      - "battle-1"
      - "--control-addr"
      - "battle-1:9101"
      - "--udp-bind-addr"
      - "0.0.0.0:7001"
      - "--udp-addr"
      - "127.0.0.1:7001"
      - "--rcenter-addr"
      - "rcenter:9002"
      - "--max-players"
      - "100"
    ports:
      - "7001:7001/udp"
    depends_on:
      rcenter:
        condition: service_started

  battle-2:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.battle
    command:
      - "--node-name"
      - "battle-2"
      - "--control-addr"
      - "battle-2:9102"
      - "--udp-bind-addr"
      - "0.0.0.0:7002"
      - "--udp-addr"
      - "127.0.0.1:7002"
      - "--rcenter-addr"
      - "rcenter:9002"
      - "--max-players"
      - "100"
    ports:
      - "7002:7002/udp"
    depends_on:
      rcenter:
        condition: service_started
  mongo:
    image: mongo:8.0
    command:
      - "mongod"
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
    volumes:
      - game-mongo-data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
volumes:
  game-redis-data:
    external: true
  game-mongo-data:
    name: "game-mongo-data"